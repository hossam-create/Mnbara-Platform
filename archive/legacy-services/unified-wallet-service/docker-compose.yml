version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: unified-wallet-postgres
    environment:
      POSTGRES_DB: unified_wallet_db
      POSTGRES_USER: unified_wallet_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - unified-wallet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unified_wallet_user -d unified_wallet_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unified-wallet-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - unified-wallet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  unified-wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unified-wallet-service
    environment:
      NODE_ENV: production
      PORT: 3016
      DATABASE_URL: postgresql://unified_wallet_user:${DB_PASSWORD:-secure_password_123}@postgres:5432/unified_wallet_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      // Fee configuration
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-2.5}
      PROCESSING_FEE_PERCENT: ${PROCESSING_FEE_PERCENT:-1.5}
      CONVERSION_FEE_PERCENT: ${CONVERSION_FEE_PERCENT:-1.0}
      MINIMUM_FEE_USD: ${MINIMUM_FEE_USD:-0.50}
      
      // Transaction limits
      DEFAULT_DAILY_LIMIT: ${DEFAULT_DAILY_LIMIT:-10000}
      DEFAULT_MONTHLY_LIMIT: ${DEFAULT_MONTHLY_LIMIT:-100000}
      DEFAULT_YEARLY_LIMIT: ${DEFAULT_YEARLY_LIMIT:-1000000}
      DEFAULT_PER_TRANSACTION_LIMIT: ${DEFAULT_PER_TRANSACTION_LIMIT:-5000}
      
      // Supported currencies
      SUPPORTED_CURRENCIES: ${SUPPORTED_CURRENCIES:-USD,EUR,GBP,SAR,AED,EGP,JPY,CNY,INR,TRY}
      
      // Security settings
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    ports:
      - "3016:3016"
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unified-wallet-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3016/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: unified-wallet-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - unified-wallet-service
    networks:
      - unified-wallet-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  unified-wallet-network:
    driver: bridge