version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ebay-live-postgres
    environment:
      POSTGRES_DB: ebay_live_db
      POSTGRES_USER: ebay_live_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ebay-live-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebay_live_user -d ebay_live_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ebay-live-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ebay-live-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ebay-live-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebay-live-service
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ebay_live_user:${DB_PASSWORD:-secure_password_123}@postgres:5432/ebay_live_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      RTMP_SECRET: ${RTMP_SECRET:-your_rtmp_secret_here}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HLS_OUTPUT_DIR: /app/media/hls
      RTMP_PORT: 1935
      HTTP_PORT: 8080
    ports:
      - "3000:3000"
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ebay-live-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ebay-live-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./media:/var/www/media
    depends_on:
      - ebay-live-service
    networks:
      - ebay-live-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ebay-live-network:
    driver: bridge