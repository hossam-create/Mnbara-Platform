version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: plugin-system-postgres
    environment:
      POSTGRES_DB: plugin_system_db
      POSTGRES_USER: plugin_system_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - plugin-system-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugin_system_user -d plugin_system_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plugin-system-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - plugin-system-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  plugin-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plugin-system-service
    environment:
      NODE_ENV: production
      PORT: 3015
      DATABASE_URL: postgresql://plugin_system_user:${DB_PASSWORD:-secure_password_123}@postgres:5432/plugin_system_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      PLUGINS_DIR: /app/plugins
      PLATFORM_VERSION: ${PLATFORM_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3015:3015"
    volumes:
      - ./plugins:/app/plugins
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plugin-system-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3015/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: plugin-system-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - ./uploads:/var/www/uploads
    depends_on:
      - plugin-system
    networks:
      - plugin-system-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  plugin-system-network:
    driver: bridge