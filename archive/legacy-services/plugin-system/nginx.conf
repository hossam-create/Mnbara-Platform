events {
    worker_connections 1024;
}

http {
    upstream plugin_system {
        server plugin-system:3015;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=plugin_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=plugin_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=plugin_sensitive:10m rate=2r/s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # File upload settings
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    server {
        listen 80;
        server_name plugins.mnbara.com;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$server_name$request_uri;

        # Plugin marketplace and API
        location /api/ {
            proxy_pass http://plugin_system;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Rate limiting
            limit_req zone=plugin_general burst=20 nodelay;
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }

        # Authentication endpoints (stricter rate limiting)
        location ~ ^/api/developers/(register|login|verify-email) {
            proxy_pass http://plugin_system;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Strict rate limiting for auth endpoints
            limit_req zone=plugin_auth burst=3 nodelay;
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Sensitive operations (strictest rate limiting)
        location ~ ^/api/(plugins|developers)/.*/(submit|install|uninstall|api-key) {
            proxy_pass http://plugin_system;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Strictest rate limiting for sensitive operations
            limit_req zone=plugin_sensitive burst=5 nodelay;
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # File uploads
        location /api/plugins/upload {
            proxy_pass http://plugin_system;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for file uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Rate limiting for uploads
            limit_req zone=plugin_sensitive burst=2 nodelay;
        }

        # Health check
        location /health {
            proxy_pass http://plugin_system;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # Static files (documentation, etc.)
        location /static/ {
            alias /var/www/static/;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Default location
        location / {
            proxy_pass http://plugin_system;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Logging
        access_log /var/log/nginx/plugin-system-access.log;
        error_log /var/log/nginx/plugin-system-error.log;
    }

    # HTTPS configuration (for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name plugins.mnbara.com;
    #     
    #     ssl_certificate /etc/nginx/ssl/plugins.mnbara.com.crt;
    #     ssl_certificate_key /etc/nginx/ssl/plugins.mnbara.com.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     
    #     # Include the same location blocks as HTTP server
    #     # ... (copy location blocks from above)
    # }
}