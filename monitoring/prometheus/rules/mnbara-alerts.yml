# Prometheus Alert Rules for Mnbara Platform

groups:
  # ============================================
  # INFRASTRUCTURE ALERTS
  # ============================================
  - name: infrastructure
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total{image!=""}[5m])) by (pod) / sum(container_spec_cpu_quota{image!=""}/container_spec_cpu_period{image!=""}) by (pod) > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage on {{ $labels.pod }}"
          description: "CPU usage on {{ $labels.pod }} is above 85% for 5 minutes"
          runbook_url: "https://wiki.mnbarh.com/runbooks/cpu-high"

      # High memory usage
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{image!=""} / container_spec_memory_limit_bytes{image!=""} > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.pod }}"
          description: "Memory usage on {{ $labels.pod }} is above 85% for 5 minutes"
          runbook_url: "https://wiki.mnbarh.com/runbooks/memory-high"

      # Pod not ready
      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 3m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been not ready for 3 minutes"
          runbook_url: "https://wiki.mnbarh.com/runbooks/pod-not-ready"

  # ============================================
  # APPLICATION ALERTS
  # ============================================
  - name: application
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate on {{ $labels.service }} is above 5% for 5 minutes"

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High latency on {{ $labels.service }}"
          description: "95th percentile latency on {{ $labels.service }} is above 2s"

  # ============================================
  # BUSINESS METRICS ALERTS
  # ============================================
  - name: business
    rules:
      # No new orders
      - alert: NoNewOrders
        expr: increase(orders_total[1h]) == 0
        for: 2h
        labels:
          severity: warning
          team: business
        annotations:
          summary: "No new orders in the last hour"
          description: "No new orders have been created in the last 2 hours"
