version: '3.8'

services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://mnbara:password@postgres:5432/mnbara_orders
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3000
      API_GATEWAY_URL: http://api-gateway:3000/api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mnbara-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: mnbara
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mnbara_orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mnbara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnbara"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  mnbara-network:
    driver: bridge
