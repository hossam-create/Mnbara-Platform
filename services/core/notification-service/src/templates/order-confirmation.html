<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background-color: #f8f9fa; padding: 20px; border-radius: 10px;">
    <h1 style="color: #27ae60;">Order Confirmed! ✓</h1>
    
    <p>Your order has been confirmed and is being processed.</p>
    
    <div style="background-color: white; padding: 20px; border-radius: 5px; margin: 20px 0;">
      <h2 style="color: #2c3e50; margin-top: 0;">Order #{{orderId}}</h2>
      
      <table style="width: 100%; border-collapse: collapse;">
        <tr>
          <td style="padding: 10px 0; border-bottom: 1px solid #ddd;"><strong>Product:</strong></td>
          <td style="padding: 10px 0; border-bottom: 1px solid #ddd;">{{productName}}</td>
        </tr>
        <tr>
          <td style="padding: 10px 0; border-bottom: 1px solid #ddd;"><strong>Amount:</strong></td>
          <td style="padding: 10px 0; border-bottom: 1px solid #ddd;">{{formatCurrency amount currency}}</td>
        </tr>
        <tr>
          <td style="padding: 10px 0;"><strong>Status:</strong></td>
          <td style="padding: 10px 0;">Processing</td>
        </tr>
      </table>
    </div>
    
    <div style="margin: 30px 0;">
      <a href="https://mnbara.com/orders/{{orderId}}" style="background-color: #3498db; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block;">View Order</a>
    </div>
    
    <p>We'll send you another email when your order ships.</p>
    
    <p>Best regards,<br>The Mnbara Team</p>
  </div>
</body>
</html>
