# Security Secrets Template for Mnbara Platform
# 
# IMPORTANT: This is a template file. Copy to secrets.yaml and replace placeholder values.
# DO NOT commit actual secrets to version control.
#
# Generate secure keys using:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

apiVersion: v1
kind: Secret
metadata:
  name: mnbara-secrets
  namespace: mnbara-production
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "mnbara_admin"
  POSTGRES_PASSWORD: "<REPLACE_WITH_SECURE_PASSWORD>"
  
  # Message Queue Credentials
  RABBITMQ_USER: "mnbara"
  RABBITMQ_PASSWORD: "<REPLACE_WITH_SECURE_PASSWORD>"
  
  # Authentication
  JWT_SECRET: "<REPLACE_WITH_64_CHAR_HEX>"
  GOOGLE_CLIENT_SECRET: "<REPLACE_WITH_GOOGLE_OAUTH_SECRET>"
  
  # Payment Providers
  STRIPE_SECRET_KEY: "<REPLACE_WITH_STRIPE_SECRET>"
  STRIPE_WEBHOOK_SECRET: "<REPLACE_WITH_STRIPE_WEBHOOK_SECRET>"
  
  # Email Configuration
  SMTP_USER: "<REPLACE_WITH_EMAIL>"
  SMTP_PASSWORD: "<REPLACE_WITH_APP_PASSWORD>"
  
  # Blockchain
  BLOCKCHAIN_RPC_URL: "<REPLACE_WITH_RPC_URL>"
  
  # ==============================================
  # NEW SECURITY KEYS (Added for missing features)
  # ==============================================
  
  # Biometric Authentication
  # Used for encrypting stored biometric public keys
  # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
  BIOMETRIC_ENCRYPTION_KEY: "<REPLACE_WITH_64_CHAR_HEX>"
  
  # Wallet Security
  # Used for encrypting sensitive wallet data
  WALLET_ENCRYPTION_KEY: "<REPLACE_WITH_64_CHAR_HEX>"
  
  # Audit Trail Security
  # Used for encrypting audit log payloads
  AUDIT_ENCRYPTION_KEY: "<REPLACE_WITH_64_CHAR_HEX>"
  
  # Used for signing audit log entries (chain integrity)
  AUDIT_SIGNING_KEY: "<REPLACE_WITH_64_CHAR_HEX>"
  
  # Fraud Detection
  # API key for IP reputation service (e.g., IPQualityScore, MaxMind)
  IP_REPUTATION_API_KEY: "<REPLACE_WITH_API_KEY>"
  
  # Optional: Additional fraud detection integrations
  # SIFT_API_KEY: "<REPLACE_WITH_SIFT_API_KEY>"
  # SIGNIFYD_API_KEY: "<REPLACE_WITH_SIGNIFYD_KEY>"

---
# Example secret generation script (run locally):
#
# #!/bin/bash
# echo "BIOMETRIC_ENCRYPTION_KEY=$(openssl rand -hex 32)"
# echo "WALLET_ENCRYPTION_KEY=$(openssl rand -hex 32)"
# echo "AUDIT_ENCRYPTION_KEY=$(openssl rand -hex 32)"
# echo "AUDIT_SIGNING_KEY=$(openssl rand -hex 32)"
# echo "JWT_SECRET=$(openssl rand -hex 32)"
