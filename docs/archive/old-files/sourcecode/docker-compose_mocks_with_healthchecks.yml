version: '3.9'
services:
  user-service:
    build: ./services/user
    ports:
    - 3001:3001
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  product-service:
    build: ./services/product
    ports:
    - 3002:3002
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3002/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  recommendation-service:
    build: ./services/recommendation
    ports:
    - 8001:8001
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  prism-mock:
    image: stoplight/prism:4
    command:
    - mock
    - -h
    - 0.0.0.0
    - /openapi/openapi.yaml
    ports:
    - 4010:4010
    volumes:
    - ./openapi_crowdshipping_expanded.yaml:/openapi/openapi.yaml
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: crowdship
      POSTGRES_PASSWORD: crowdpass
      POSTGRES_DB: crowdshipping
    ports:
    - 5432:5432
  redis:
    image: redis:6
    ports:
    - 6379:6379
  minio:
    image: minio/minio
    command: server /data
    ports:
    - 9000:9000
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
    - 9200:9200
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: '2181'
      ZOOKEEPER_TICK_TIME: '2000'
    ports:
    - 2181:2181
  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
    - zookeeper
    environment:
      KAFKA_BROKER_ID: '1'
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
    ports:
    - 9092:9092
