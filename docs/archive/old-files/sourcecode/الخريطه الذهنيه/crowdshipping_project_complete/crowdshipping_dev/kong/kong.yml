_format_version: "2.1"
_transform: true

services:
- name: user-service
  url: http://user-service:3001
  routes:
  - name: user-route
    paths: ["/api/users"]

- name: product-service
  url: http://product-service:3002
  routes:
  - name: product-route
    paths: ["/api/products"]

- name: recommendation
  url: http://recommendation:8001
  routes:
  - name: rec-route
    paths: ["/api/recommendations"]

plugins:
- name: rate-limiting
  service: user-service
  config:
    minute: 60
