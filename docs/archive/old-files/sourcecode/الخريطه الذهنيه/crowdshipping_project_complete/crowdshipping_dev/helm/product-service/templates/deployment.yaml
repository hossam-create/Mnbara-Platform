apiVersion: apps/v1
kind: Deployment
metadata:
  name: { .Release.Name }-product-service
  labels:
    app: product-service
spec:
  replicas: { .Values.replicaCount }
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: "{ .Values.image.repository }:{ .Values.image.tag }"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
