
openapi: 3.0.3
info:
  title: Crowdshipping API
  version: "1.0.0"
  description: |
    Crowdshipping platform API - bilingual descriptions included.
    واجهات API لمنصة نقل البضائع بمساعدة المسافرين.
servers:
  - url: https://api.example.com/v1
    description: Production / الإنتاج
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        roles:
          type: array
          items:
            type: string
        rating:
          type: number
        kyc_status:
          type: boolean
    LocationPayload:
      type: object
      properties:
        lat:
          type: number
        lon:
          type: number
        country:
          type: string
        airport_code:
          type: string
    Product:
      type: object
      properties:
        product_id:
          type: string
        seller_id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        origin_country:
          type: string
        price:
          type: number
        listing_type:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
            lon:
              type: number
    Auction:
      type: object
      properties:
        auction_id:
          type: string
        product_id:
          type: string
        start_price:
          type: number
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
    Bid:
      type: object
      properties:
        bid_id:
          type: string
        auction_id:
          type: string
        bidder_id:
          type: string
        bid_amount:
          type: number
        bid_time:
          type: string
          format: date-time
paths:
  /auth/login:
    post:
      summary: User login / تسجيل الدخول
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /travelers/{id}/location:
    post:
      summary: Update traveler location / تحديث موقع المسافر
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPayload'
      responses:
        '204':
          description: No Content
  /recommendations:
    get:
      summary: Get recommendations for traveler / استعلام التوصيات للمسافر
      security:
        - bearerAuth: []
      parameters:
        - name: traveler_id
          in: query
          required: true
          schema:
            type: string
        - name: radius_km
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /products:
    post:
      summary: Create product listing / إضافة منتج
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Created
  /products/{id}/bid:
    post:
      summary: Place a bid on an auction / تقديم مزايدة
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bid_amount:
                  type: number
      responses:
        '201':
          description: Bid placed
  /auctions/{id}/start:
    post:
      summary: Start an auction for a product / بدء مزاد
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auction'
      responses:
        '201':
          description: Auction started
  /nearby-requests:
    get:
      summary: Get nearby buy requests / طلبات الشراء القريبة
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lon
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    request_id:
                      type: string
                    product_name:
                      type: string
                    max_price:
                      type: number
