
openapi: 3.0.0
info:
  title: Crowdshipping API
  version: "1.0.0"
paths:
  /api/v1/travelers/{id}/location:
    post:
      summary: Update traveler location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                lon:
                  type: number
                country:
                  type: string
                airport_code:
                  type: string
      responses:
        '200':
          description: OK
  /api/v1/recommendations:
    get:
      summary: Get recommendations for traveler
      parameters:
        - name: traveler_id
          in: query
          required: true
          schema:
            type: string
        - name: radius_km
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: list of recommended products
