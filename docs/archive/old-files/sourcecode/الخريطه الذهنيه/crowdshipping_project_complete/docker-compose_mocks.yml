version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: crowdshipping
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crowd_net

  redis:
    image: redis:7-alpine
    networks:
      - crowd_net

  minio:
    image: minio/minio:RELEASE.2025-01-01T00-00-00Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data
    ports:
      - "9000:9000"
    networks:
      - crowd_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - crowd_net

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - crowd_net

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      - crowd_net

  prism-mock:
    image: stoplight/prism:4
    command: mock -h 0.0.0.0 /openapi/openapi_crowdshipping_expanded.yaml
    volumes:
      - ./openapi_crowdshipping_expanded.yaml:/openapi/openapi_crowdshipping_expanded.yaml:ro
    ports:
      - "4010:4010"
    networks:
      - crowd_net

  user-service:
    build: ./services/user
    environment:
      - SERVICE_NAME=user-service
    ports:
      - "3001:3000"
    networks:
      - crowd_net

  product-service:
    build: ./services/product
    environment:
      - SERVICE_NAME=product-service
    ports:
      - "3002:3000"
    networks:
      - crowd_net

  recommendation-service:
    build: ./services/recommendation
    environment:
      - SERVICE_NAME=recommendation-service
    ports:
      - "8001:8000"
    networks:
      - crowd_net

volumes:
  pgdata:
  esdata:

networks:
  crowd_net: