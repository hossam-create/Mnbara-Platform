version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: crowd
      POSTGRES_PASSWORD: crowdpass
      POSTGRES_DB: crowdshipping
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  api-gateway:
    image: kong:3.3.0
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml

  user-service:
    image: crowdshipping/user-service:dev
    build: ./services/user
    environment:
      DATABASE_URL: postgres://crowd:crowdpass@postgres:5432/crowdshipping
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio

  product-service:
    image: crowdshipping/product-service:dev
    build: ./services/product
    environment:
      DATABASE_URL: postgres://crowd:crowdpass@postgres:5432/crowdshipping
      SEARCH_URL: http://elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - minio

  recommendation-service:
    image: crowdshipping/recommendation-service:dev
    build: ./services/recommendation
    environment:
      KAFKA_BROKERS: kafka:9092
      FEATURE_STORE: redis://redis:6379
    depends_on:
      - kafka
      - redis
      - postgres

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.1
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      API_URL: /openapi_crowdshipping_expanded.yaml
    volumes:
      - ./openapi_crowdshipping_expanded.yaml:/usr/share/nginx/html/openapi_crowdshipping_expanded.yaml:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
  esdata:
