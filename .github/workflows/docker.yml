name: Docker Build & Push

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/services/**/Dockerfile'
      - 'backend/services/**/package.json'
      - 'frontend/**/Dockerfile'
      - 'frontend/**/package.json'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated list of services to build'
        required: false
        default: ''
      push:
        description: 'Push images to registry'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '18'
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================
  # Docker Build Test (no push)
  # ============================================
  build-test:
    name: Build Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.push == 'false'
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - listing-service
          - auction-service
          - payment-service
          - escrow-service
          - notification-service
          - orders-service
          - matching-service
          - internal-ledger-service
          - ai-core
          - recommendation-service
          - chat-service
          - user-service
          - trips-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if service exists
        id: check-service
        run: |
          if [ -d "backend/services/${{ matrix.service }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=backend/services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          elif [ -d "frontend/${{ matrix.service }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=frontend/${{ matrix.service }}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if Dockerfile exists
        if: steps.check-service.outputs.exists == 'true'
        id: check-dockerfile
        run: |
          if [ -f "${{ steps.check-service.outputs.path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.check-service.outputs.path }}
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:test
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify image
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          echo "Image ${{ matrix.service }} built successfully"
          docker images ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:test

  # ============================================
  # Docker Build & Push (with push)
  # ============================================
  build-and-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - listing-service
          - auction-service
          - payment-service
          - escrow-service
          - notification-service
          - orders-service
          - matching-service
          - internal-ledger-service
          - ai-core
          - recommendation-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if service exists
        id: check-service
        run: |
          if [ -d "backend/services/${{ matrix.service }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=backend/services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if Dockerfile exists
        if: steps.check-service.outputs.exists == 'true'
        id: check-dockerfile
        run: |
          if [ -f "${{ steps.check-service.outputs.path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        if: steps.check-dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push ${{ matrix.service }}
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.check-service.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}

      - name: Image digest for ${{ matrix.service }}
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          echo "Image ${{ matrix.service }}: ${{ steps.meta.outputs.tags }}"
          echo "Digest: $(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest 2>/dev/null || echo 'N/A')"

  # ============================================
  # Frontend Docker Builds
  # ============================================
  frontend-build:
    name: Build Frontend - ${{ matrix.frontend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend:
          - web
          - admin-dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check-dockerfile
        run: |
          if [ -f "frontend/${{ matrix.frontend }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: frontend/${{ matrix.frontend }}
          push: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.frontend }}:test
          cache-from: type=gha,scope=${{ matrix.frontend }}
          cache-to: type=gha,mode=max,scope=${{ matrix.frontend }}

  # ============================================
  # Docker Security Scan
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: 'refs/heads/main'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Fail on high vulnerabilities
        run: |
          if grep -q '"Severity":"HIGH"' trivy-results.sarif || grep -q '"Severity":"CRITICAL"' trivy-results.sarif; then
            echo "High or critical vulnerabilities found!"
            exit 1
          fi

  # ============================================
  # Docker Summary
  # ============================================
  docker-summary:
    name: Docker Summary
    runs-on: ubuntu-latest
    needs: [build-test, frontend-build, security-scan]
    if: always()
    steps:
      - name: Docker Build Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Built" >> $GITHUB_STEP_SUMMARY
          echo "- api-gateway" >> $GITHUB_STEP_SUMMARY
          echo "- auth-service" >> $GITHUB_STEP_SUMMARY
          echo "- listing-service" >> $GITHUB_STEP_SUMMARY
          echo "- auction-service" >> $GITHUB_STEP_SUMMARY
          echo "- payment-service" >> $GITHUB_STEP_SUMMARY
          echo "- notification-service" >> $GITHUB_STEP_SUMMARY
          echo "- orders-service" >> $GITHUB_STEP_SUMMARY
