name: Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/services/**'
      - 'frontend/**'
      - 'test/integration/**'
      - 'package.json'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment (staging, production)'
        required: false
        default: 'staging'
      test_suite:
        description: 'Test suite to run (all, api, e2e, contract)'
        required: false
        default: 'all'

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-east-1'

jobs:
  # ============================================
  # Integration Test Preparation
  # ============================================
  prepare:
    name: Prepare Tests
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect environment
        id: detect
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi
          echo "Running integration tests on ${{ steps.detect.outputs.environment }}"

  # ============================================
  # API Integration Tests
  # ============================================
  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: prepare
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mnbarh_test
          POSTGRES_USER: mnbarh
          POSTGRES_PASSWORD: mnbarh_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-management-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Database Schema
        run: |
          export DATABASE_URL="postgresql://mnbarh:mnbarh_test_password@localhost:5432/mnbarh_test"
          
          # Run Prisma generate
          for service in backend/services/*/; do
            if [ -f "$service/prisma/schema.prisma" ]; then
              echo "Generating Prisma client for $service"
              cd "$service"
              npx prisma generate || true
              cd -
            fi
          done

      - name: Run API Integration Tests
        run: |
          export DATABASE_URL="postgresql://mnbarh:mnbarh_test_password@localhost:5432/mnbarh_test"
          export REDIS_URL="redis://localhost:6379"
          export RABBITMQ_URL="amqp://localhost:5672"
          export NODE_ENV=test
          
          # Run integration tests
          npm run test:integration || npx vitest run test/integration --reporter=verbose

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-results
          path: |
            test-results/
            coverage/

      - name: API Test Summary
        if: always()
        run: |
          echo "## API Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Service-to-Service Integration Tests
  # ============================================
  service-integration-tests:
    name: Service Integration Tests
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            test_pattern: '**/test/**/*gateway*.test.ts'
          - name: auth-service
            test_pattern: '**/test/**/*auth*.test.ts'
          - name: payment-service
            test_pattern: '**/test/**/*payment*.test.ts'
          - name: listing-service
            test_pattern: '**/test/**/*listing*.test.ts'
          - name: orders-service
            test_pattern: '**/test/**/*order*.test.ts'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Check if service exists
        id: check-service
        run: |
          if [ -d "backend/services/${{ matrix.service.name }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-service.outputs.exists == 'true'
        working-directory: backend/services/${{ matrix.service.name }}
        run: npm ci

      - name: Run Service Integration Tests
        if: steps.check-service.outputs.exists == 'true'
        working-directory: backend/services/${{ matrix.service.name }}
        run: |
          npm test -- --testPathPattern="${{ matrix.service.test_pattern }}" --reporter=verbose || true
        env:
          NODE_ENV: test

      - name: Upload Service Test Results
        if: steps.check-service.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}-integration-results
          path: coverage/

  # ============================================
  # End-to-End Tests
  # ============================================
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for E2E tests
        id: check-e2e
        run: |
          if [ -d "test/e2e" ] || [ -d "frontend/web/test-e2e" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Playwright
        if: steps.check-e2e.outputs.exists == 'true'
        uses: browser-actions/setup-playwright@latest
        with:
          install-chromium: true

      - name: Run E2E Tests
        if: steps.check-e2e.outputs.exists == 'true'
        run: |
          npm run test:e2e || npx playwright test || echo "E2E tests not configured"
        env:
          BASE_URL: ${{ needs.prepare.outputs.environment == 'staging' && 'https://api.staging.mnbarh.com' || 'http://localhost:3000' }}

      - name: Upload E2E Results
        if: steps.check-e2e.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/

  # ============================================
  # Contract Tests (API Schema Validation)
  # ============================================
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for OpenAPI specs
        id: check-specs
        run: |
          if [ -d "backend/services" ]; then
            SPECS=$(find backend/services -name "*.yaml" -o -name "*.json" | grep -E "(openapi|swagger)" | wc -l)
            echo "count=$SPECS" >> $GITHUB_OUTPUT
          fi

      - name: Validate OpenAPI Specifications
        if: steps.check-specs.outputs.count > 0
        run: |
          npm install -g @apidevtools/swagger-cli || true
          
          for spec in $(find backend/services -name "*.yaml" -o -name "*.json" | grep -E "(openapi|swagger)"); do
            echo "Validating $spec"
            swagger-cli validate "$spec" || echo "Validation failed for $spec"
          done

      - name: Check API Compatibility
        run: |
          echo "Checking API backward compatibility..."
          
          # Check for breaking changes in API responses
          for service in backend/services/*/; do
            if [ -f "$service/src/routes.ts" ]; then
              echo "Checking routes in $service"
            fi
          done

  # ============================================
  # Database Integration Tests
  # ============================================
  database-integration-tests:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    needs: prepare
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mnbarh_test
          POSTGRES_USER: mnbarh
          POSTGRES_PASSWORD: mnbarh_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run Prisma Integration Tests
        run: |
          export DATABASE_URL="postgresql://mnbarh:mnbarh_test_password@localhost:5432/mnbarh_test"
          
          for service in backend/services/*/; do
            if [ -f "$service/prisma/schema.prisma" ] && [ -d "$service/test" ]; then
              echo "Running Prisma integration tests for $service"
              cd "$service"
              npm test -- --testPathPattern="integration|prisma" || true
              cd -
            fi
          done

      - name: Test Database Migrations
        run: |
          export DATABASE_URL="postgresql://mnbarh:mnbarh_test_password@localhost:5432/mnbarh_test"
          
          for service in backend/services/*/; do
            if [ -f "$service/prisma/schema.prisma" ]; then
              echo "Testing migration for $service"
              cd "$service"
              npx prisma migrate deploy || true
              cd -
            fi
          done

  # ============================================
  # Message Queue Integration Tests
  # ============================================
  message-queue-tests:
    name: Message Queue Integration Tests
    runs-on: ubuntu-latest
    needs: prepare
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run Message Queue Tests
        run: |
          export RABBITMQ_URL="amqp://localhost:5672"
          
          for service in backend/services/*/; do
            if [ -f "$service/package.json" ] && grep -q "amqplib\|rabbitmq" "$service/package.json"; then
              echo "Running message queue tests for $service"
              cd "$service"
              npm test -- --testPathPattern="message|queue|rabbitmq|event" || true
              cd -
            fi
          done

  # ============================================
  # Integration Tests Summary
  # ============================================
  integration-summary:
    name: Integration Tests Summary
    runs-on: ubuntu-latest
    needs: [
      api-integration-tests,
      service-integration-tests,
      e2e-tests,
      contract-tests,
      database-integration-tests,
      message-queue-tests
    ]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Integration Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Integration Tests | ${{ needs.api-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service Integration Tests | ${{ needs.service-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| End-to-End Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Tests | ${{ needs.contract-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Integration Tests | ${{ needs.database-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Message Queue Tests | ${{ needs.message-queue-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check overall status
          if [ "${{ needs.api-integration-tests.result }}" == "success" ] || \
             [ "${{ needs.service-integration-tests.result }}" == "success" ]; then
            echo "✅ Core integration tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Integration tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ Integration Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Integration Tests Failed*\n*Branch:* ${{ github.ref_name }}\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
