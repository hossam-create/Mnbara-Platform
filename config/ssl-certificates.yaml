# SSL Certificates Configuration
# Mnbara Platform - Production SSL Setup
# Status: FINAL 5% COMPLETION

# Let's Encrypt ClusterIssuer for Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # ACME server URL for Let's Encrypt production
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address for ACME registration
    email: admin@mnbarh.com
    # Secret to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod
    # Enable HTTP-01 challenge provider
    solvers:
    - http01:
        ingress:
          class: nginx
    # Enable DNS-01 challenge provider (optional)
    - dns01:
        cloudflare:
          email: admin@mnbarh.com
          apiKeySecretRef:
            name: cloudflare-api-key
            key: api-key

---
# Main Domain Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mnbarh-tls
  namespace: mnbarh-production
spec:
  secretName: mnbarh-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - mnbarh.com
  - www.mnbarh.com

---
# API Domain Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-mnbarh-tls
  namespace: mnbarh-production
spec:
  secretName: api-mnbarh-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - api.mnbarh.com

---
# Monitoring Domain Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-mnbarh-tls
  namespace: mnbarh-monitoring
spec:
  secretName: monitoring-mnbarh-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - monitoring.mnbarh.com

---
# Status Page Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: status-mnbarh-tls
  namespace: mnbarh-production
spec:
  secretName: status-mnbarh-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - status.mnbarh.com

---
# Wildcard Certificate (Alternative approach)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-mnbarh-tls
  namespace: mnbarh-production
spec:
  secretName: wildcard-mnbarh-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "*.mnbarh.com"
  - mnbarh.com

---
# SSL Configuration for Nginx Ingress
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ssl-config
  namespace: mnbarh-production
data:
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384"
  ssl-prefer-server-ciphers: "off"
  ssl-session-cache: "shared:SSL:10m"
  ssl-session-timeout: "10m"
  ssl-buffer-size: "4k"
  
  # Security Headers
  add-headers: |
    Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    X-Frame-Options DENY always;
    X-Content-Type-Options nosniff always;
    X-XSS-Protection "1; mode=block" always;
    Referrer-Policy "strict-origin-when-cross-origin" always;
    Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.mnbarh.com wss://mnbarh.com; frame-src https://www.google.com https://www.facebook.com;" always;

---
# Certificate Renewal Job
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cert-renewal-check
  namespace: mnbarh-production
spec:
  schedule: "0 2 * * *" # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cert-check
            image: alpine/curl:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Checking SSL certificate expiration..."
              
              # Check main domain
              EXPIRY=$(echo | openssl s_client -servername mnbarh.com -connect mnbarh.com:443 2>/dev/null | openssl x509 -noout -dates | grep notAfter | cut -d= -f2)
              EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
              CURRENT_EPOCH=$(date +%s)
              DAYS_LEFT=$(( (EXPIRY_EPOCH - CURRENT_EPOCH) / 86400 ))
              
              echo "Certificate expires in $DAYS_LEFT days"
              
              if [ $DAYS_LEFT -lt 30 ]; then
                echo "Certificate expires in less than 30 days, triggering renewal..."
                # Trigger cert-manager renewal
                kubectl annotate certificate mnbarh-tls cert-manager.io/force-renewal=$(date +%s) -n mnbarh-production
              else
                echo "Certificate is valid for $DAYS_LEFT more days"
              fi
          restartPolicy: OnFailure

---
# SSL Certificate Monitoring
apiVersion: v1
kind: Service
metadata:
  name: ssl-monitor
  namespace: mnbarh-production
  labels:
    app: ssl-monitor
spec:
  ports:
  - port: 9117
    name: metrics
  selector:
    app: ssl-monitor

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-monitor
  namespace: mnbarh-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssl-monitor
  template:
    metadata:
      labels:
        app: ssl-monitor
    spec:
      containers:
      - name: ssl-exporter
        image: ribbybibby/ssl-exporter:latest
        ports:
        - containerPort: 9117
        args:
        - --web.listen-address=:9117
        - --config.file=/etc/ssl-exporter/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/ssl-exporter
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: config
        configMap:
          name: ssl-exporter-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-exporter-config
  namespace: mnbarh-production
data:
  config.yaml: |
    modules:
      https:
        prober: https
        timeout: 10s
        https:
          valid_status_codes: [200, 301, 302]
          method: GET
          no_follow_redirects: false
          fail_if_ssl: false
          fail_if_not_ssl: true
          
    targets:
      - name: mnbarh-main
        url: https://mnbarh.com
      - name: mnbarh-api
        url: https://api.mnbarh.com
      - name: mnbarh-monitoring
        url: https://monitoring.mnbarh.com
      - name: mnbarh-status
        url: https://status.mnbarh.com