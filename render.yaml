# mnbarh Platform - Render Deployment Configuration
# Simplified deployment with frontend and core backend service

services:
  # Frontend Web App (Vite React)
  - type: web
    name: mnbarh-web
    env: static
    plan: free
    buildCommand: cd frontend/web-app && npm install && npm run build
    staticPublishPath: frontend/web-app/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://mnbarh-listing-service.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://mnbarh-listing-service.onrender.com
    healthCheckPath: /
    autoDeploy: true

  # Listing Service (Main Backend)
  - type: web
    name: mnbarh-listing-service
    env: node
    plan: free
    buildCommand: cd backend/services/listing-service-node && npm install
    startCommand: cd backend/services/listing-service-node && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

# Databases
databases:
  # PostgreSQL Database
  - name: mnbarh-postgres
    plan: free
    databaseName: mnbarh_prod
    user: mnbarh_user
    ipAllowList: []

