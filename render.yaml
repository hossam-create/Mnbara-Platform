# Mnbara Platform - Render Deployment Configuration
# Comprehensive microservices deployment

services:
  # Frontend Web App (React/Next.js)
  - type: web
    name: mnbarh-web
    env: static
    plan: free
    buildCommand: cd frontend/web-app && npm install && npm run build
    staticPublishPath: frontend/web-app/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://mnbarh-api-gateway.onrender.com
    healthCheckPath: /
    autoDeploy: true

  # Admin Dashboard
  - type: web
    name: mnbarh-admin
    env: static
    plan: free
    buildCommand: cd frontend/admin-dashboard && npm install && npm run build
    staticPublishPath: frontend/admin-dashboard/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://mnbarh-api-gateway.onrender.com
    healthCheckPath: /
    autoDeploy: true

  # API Gateway (Main Backend Service)
  - type: web
    name: mnbarh-api-gateway
    env: node
    plan: free
    buildCommand: cd backend/services/api-gateway && npm install && npm run build
    startCommand: cd backend/services/api-gateway && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mnbarh-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mnbarh-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

  # Auth Service
  - type: web
    name: mnbarh-auth-service
    env: node
    plan: free
    buildCommand: cd backend/services/auth-service && npm install && npm run build
    startCommand: cd backend/services/auth-service && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10001
      - key: DATABASE_URL
        fromDatabase:
          name: mnbarh-postgres
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: mnbarh-api-gateway
          envVarKey: JWT_SECRET
    healthCheckPath: /health
    autoDeploy: true

  # Listing Service
  - type: web
    name: mnbarh-listing-service
    env: node
    plan: free
    buildCommand: cd backend/services/listing-service && npm install && npm run build
    startCommand: cd backend/services/listing-service && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10002
      - key: DATABASE_URL
        fromDatabase:
          name: mnbarh-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mnbarh-redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  # Payment Service
  - type: web
    name: mnbarh-payment-service
    env: node
    plan: free
    buildCommand: cd backend/services/payment-service && npm install && npm run build
    startCommand: cd backend/services/payment-service && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10003
      - key: DATABASE_URL
        fromDatabase:
          name: mnbarh-postgres
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # Auction Service
  - type: web
    name: mnbarh-auction-service
    env: node
    plan: free
    buildCommand: cd backend/services/auction-service && npm install && npm run build
    startCommand: cd backend/services/auction-service && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10004
      - key: DATABASE_URL
        fromDatabase:
          name: mnbarh-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mnbarh-redis
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

# Databases
databases:
  # PostgreSQL Database
  - name: mnbarh-postgres
    plan: free
    databaseName: mnbarh_prod
    user: mnbarh_user
    ipAllowList: []
    
  # Redis Cache
  - name: mnbarh-redis
    plan: free
    ipAllowList: []
