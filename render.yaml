# mnbarh Platform - Render Deployment Configuration
# Simplified deployment with frontend and core backend service

services:
  # Frontend Web App (Vite React)
  - type: web
    name: mnbarh-web
    env: static
    plan: free
    buildCommand: cd frontend/web-app && npm install && npm run build
    staticPublishPath: frontend/web-app/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://mnbarh-listing-service.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://mnbarh-listing-service.onrender.com
    healthCheckPath: /
    autoDeploy: true

  # Listing Service (Main Backend)
  - type: web
    name: mnbarh-listing-service
    env: node
    plan: free
    buildCommand: cd backend/services/listing-service-node && npm install
    startCommand: cd backend/services/listing-service-node && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

  # Decision Authority Service
  - type: web
    name: mnbarh-decision-authority-service
    env: node
    plan: free
    buildCommand: cd backend/services/decision-authority-service && npm install && npm run build
    startCommand: cd backend/services/decision-authority-service && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10001
      - key: DECISION_AUTHORITY_MODE
        value: INTERNAL
      - key: DECISION_TIMEOUT_MS
        value: 30000
      - key: DECISION_POLL_INTERVAL_MS
        value: 5000
      - key: LOG_LEVEL
        value: info
      - key: METRICS_ENABLED
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: mnbarh-postgres
          property: connectionString
      - key: CUSTODII_API_URL
        value: https://staging-api.custodii.com/v1
      - key: CUSTODII_API_KEY
        sync: false
      - key: CUSTODII_WEBHOOK_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true

# Databases
databases:
  # PostgreSQL Database
  - name: mnbarh-postgres
    plan: free
    databaseName: mnbarh_prod
    user: mnbarh_user
    ipAllowList: []

