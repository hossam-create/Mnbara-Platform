# Archived Services Docker Compose Configuration

# This file contains all 71 archived services with their configurations
# Services are organized by phase and can be activated incrementally

version: '3.8'

services:
  # ========================================
  # PHASE 1: CRITICAL SERVICES (21 services)
  # ========================================

  # 1. audit-service
  audit-service:
    build: ./backend/services/archived/audit-service
    container_name: mnbarh-audit-service
    ports:
      - "3017:3017"
    environment:
      - DATABASE_URL=postgresql://mnbarh:mnbarh_dev_password@postgres:5432/mnbarh
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis:6379
      - PORT=3017
    networks:
      - mnbarh-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3017/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. logging-service
  logging-service:
    build: ./backend/services/archived/logging-service
