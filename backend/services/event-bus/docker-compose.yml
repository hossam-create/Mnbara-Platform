version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: event-bus-postgres
    environment:
      POSTGRES_DB: event_bus_db
      POSTGRES_USER: event_bus_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - event-bus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_bus_user -d event_bus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: event-bus-redis
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    networks:
      - event-bus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-bus-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-bus-service
    environment:
      NODE_ENV: production
      PORT: 3017
      DATABASE_URL: postgresql://event_bus_user:${DB_PASSWORD:-secure_password_123}@postgres:5432/event_bus_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      // Event processing configuration
      EVENT_BATCH_SIZE: ${EVENT_BATCH_SIZE:-100}
      EVENT_FLUSH_INTERVAL: ${EVENT_FLUSH_INTERVAL:-5000}
      EVENT_MAX_RETRIES: ${EVENT_MAX_RETRIES:-3}
      EVENT_RETRY_DELAY: ${EVENT_RETRY_DELAY:-1000}
      
      // Storage configuration
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-365}
      EVENT_ARCHIVE_ENABLED: ${EVENT_ARCHIVE_ENABLED:-true}
      EVENT_COMPRESSION_ENABLED: ${EVENT_COMPRESSION_ENABLED:-true}
      
      // Analytics configuration
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-true}
      ANALYTICS_AGGREGATION_INTERVAL: ${ANALYTICS_AGGREGATION_INTERVAL:-60000}
      ANALYTICS_ALERT_CHECK_INTERVAL: ${ANALYTICS_ALERT_CHECK_INTERVAL:-300000}
      
      // Security configuration
      EVENT_RATE_LIMIT_MAX: ${EVENT_RATE_LIMIT_MAX:-1000}
      EVENT_RATE_LIMIT_WINDOW: ${EVENT_RATE_LIMIT_WINDOW:-60000}
      EVENT_ENCRYPTION_ENABLED: ${EVENT_ENCRYPTION_ENABLED:-false}
      
      // Monitoring configuration
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-30000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: ${METRICS_PORT:-9090}
    ports:
      - "3017:3017"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./archives:/app/archives
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - event-bus-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3017/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: event-bus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - event-bus-service
    networks:
      - event-bus-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  event-bus-network:
    driver: bridge