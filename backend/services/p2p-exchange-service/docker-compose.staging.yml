version: '3.8'

services:
  # P2P Exchange Service
  p2p-exchange-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: mnbarh/p2p-exchange-service:staging
    container_name: p2p-exchange-service-staging
    env_file:
      - .env.staging
    ports:
      - "3005:3005"
    networks:
      - mnbarh-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: p2p-exchange-db-staging
    environment:
      POSTGRES_DB: p2p_exchange_staging
      POSTGRES_USER: mnbarh_staging
      POSTGRES_PASSWORD: staging_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mnbarh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnbarh_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: p2p-exchange-redis-staging
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - mnbarh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: p2p-exchange-prometheus-staging
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus-data:/prometheus
    networks:
      - mnbarh-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: p2p-exchange-grafana-staging
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=staging_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/p2p-exchange.json
      - grafana-data:/var/lib/grafana
    networks:
      - mnbarh-network
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  mnbarh-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
