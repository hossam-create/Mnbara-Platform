# =============================================================================
# Mnbara Platform - Kubernetes ConfigMap Configuration
# =============================================================================
# Centralized configuration for microservices
# Use Secrets for sensitive data (passwords, API keys, etc.)
# =============================================================================

---
# =============================================================================
# Application ConfigMap
# =============================================================================
# Contains non-sensitive application configuration
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ${SERVICE_NAME:-mnbara-service}-config
  namespace: ${NAMESPACE:-mnbara}
  labels:
    app: ${SERVICE_NAME:-mnbara-service}
    version: ${SERVICE_VERSION:-latest}
    environment: ${ENVIRONMENT:-dev}
    managed-by: kubectl
  annotations:
    description: Application configuration for ${SERVICE_NAME:-mnbara-service}
    version: ${CONFIG_VERSION:-1.0.0}

data:
  # =============================================================================
  # Application Settings
  # =============================================================================
  
  # Service configuration
  SERVICE_NAME: "${SERVICE_NAME:-mnbara-service}"
  SERVICE_PORT: "${CONTAINER_PORT:-3000}"
  NODE_ENV: "${NODE_ENV:-production}"
  
  # Logging configuration
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_FORMAT: "${LOG_FORMAT:-json}"
  LOG_OUTPUT: "${LOG_OUTPUT:-stdout}"
  
  # =============================================================================
  # Database Configuration
  # =============================================================================
  
  # PostgreSQL
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_NAME: "${DB_NAME:-mnbara}"
  DB_POOL_MIN: "${DB_POOL_MIN:-2}"
  DB_POOL_MAX: "${DB_POOL_MAX:-10}"
  DB_CONNECTION_TIMEOUT: "${DB_CONNECTION_TIMEOUT:-30000}"
  
  # MongoDB (if applicable)
  # MONGODB_URI: "mongodb://${MONGODB_HOST:-mongodb}:${MONGODB_PORT:-27017}/${MONGODB_DB:-mnbara}"
  
  # Redis
  REDIS_HOST: "${REDIS_HOST:-redis}"
  REDIS_PORT: "${REDIS_PORT:-6379}"
  REDIS_DB: "${REDIS_DB:-0}"
  
  # Elasticsearch
  ELASTICSEARCH_URL: "${ELASTICSEARCH_URL:-http://elasticsearch:9200}"
  ELASTICSEARCH_INDEX: "${ELASTICSEARCH_INDEX:-mnbara}"
  
  # =============================================================================
  # API & Rate Limiting
  # =============================================================================
  
  API_PREFIX: "${API_PREFIX:-/api/v1}"
  RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-900000}"
  RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-100}"
  
  # =============================================================================
  # Feature Flags
  # =============================================================================
  
  FEATURE_CACHE_ENABLED: "${FEATURE_CACHE_ENABLED:-true}"
  FEATURE_METRICS_ENABLED: "${FEATURE_METRICS_ENABLED:-true}"
  FEATURE_PROFILING_ENABLED: "${FEATURE_PROFILING_ENABLED:-false}"
  
  # =============================================================================
  # CORS Configuration
  # =============================================================================
  
  CORS_ORIGIN: "${CORS_ORIGIN:-*}"
  CORS_METHODS: "${CORS_METHODS:-GET,POST,PUT,DELETE,PATCH}"
  CORS_CREDENTIALS: "${CORS_CREDENTIALS:-true}"
  CORS_MAX_AGE: "${CORS_MAX_AGE:-86400}"

---

# =============================================================================
# Environment ConfigMap
# =============================================================================
# Contains environment-specific settings
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ${SERVICE_NAME:-mnbara-service}-env
  namespace: ${NAMESPACE:-mnbara}
  labels:
    app: ${SERVICE_NAME:-mnbara-service}
    version: ${SERVICE_VERSION:-latest}
    environment: ${ENVIRONMENT:-dev}
    managed-by: kubectl
  annotations:
    description: Environment variables for ${SERVICE_NAME:-mnbara-service}

data:
  # =============================================================================
  # Environment Identification
  # =============================================================================
  
  ENVIRONMENT: "${ENVIRONMENT:-dev}"
  ENVIRONMENT_NAME: "${ENVIRONMENT_NAME:-Development}"
  DEPLOYMENT_REGION: "${DEPLOYMENT_REGION:-us-central1}"
  
  # =============================================================================
  # External Services URLs
  # =============================================================================
  
  # Service endpoints (replace with actual service names)
  USER_SERVICE_URL: "http://user-service.${NAMESPACE:-mnbara}.svc.cluster.local:80"
  MATCHING_SERVICE_URL: "http://matching-service.${NAMESPACE:-mnbara}.svc.cluster.local:80"
  ORDER_SERVICE_URL: "http://order-service.${NAMESPACE:-mnbara}.svc.cluster.local:80"
  TRIP_SERVICE_URL: "http://trip-service.${NAMESPACE:-mnbara}.svc.cluster.local:80"
  PAYMENT_SERVICE_URL: "http://payment-service.${NAMESPACE:-mnbara}.svc.cluster.local:80"
  
  # =============================================================================
  # Monitoring
  # =============================================================================
  
  METRICS_PATH: "${METRICS_PATH:-/metrics}"
  METRICS_PORT: "${METRICS_PORT:-9090}"
  TRACING_ENABLED: "${TRACING_ENABLED:-false}"
  TRACING_SAMPLE_RATE: "${TRACING_SAMPLE_RATE:-1.0}"
  
  # =============================================================================
  # Performance Tuning
  # =============================================================================
  
  WORKER_THREADS: "${WORKER_THREADS:-auto}"
  MAX_PAYLOAD_SIZE: "${MAX_PAYLOAD_SIZE:-10mb}"
  REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-30000}"
  RESPONSE_TIMEOUT: "${RESPONSE_TIMEOUT:-30000}"

---

# =============================================================================
# Database Connection Pool ConfigMap
# =============================================================================
# Database-specific connection settings
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ${SERVICE_NAME:-mnbara-service}-db-config
  namespace: ${NAMESPACE:-mnbara}
  labels:
    app: ${SERVICE_NAME:-mnbara-service}
    version: ${SERVICE_VERSION:-latest}
    environment: ${ENVIRONMENT:-dev}
    managed-by: kubectl

data:
  # =============================================================================
  # PostgreSQL Settings
  # =============================================================================
  
  PGDATABASE: "${DB_NAME:-mnbara}"
  PGHOST: "${DB_HOST:-postgres}"
  PGPORT: "${DB_PORT:-5432}"
  PGUSER: "${DB_USER:-mnbara}"
  
  # =============================================================================
  # Connection Pool Settings
  # =============================================================================
  
  DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-10}"
  DATABASE_IDLE_TIMEOUT: "${DATABASE_IDLE_TIMEOUT:-10000}"
  DATABASE_CONNECTION_LIFETIME: "${DATABASE_CONNECTION_LIFETIME:-60000}"
  
  # =============================================================================
  # Prepared Statements
  # =============================================================================
  
  DATABASE_PREPARED_STATEMENTS: "${DATABASE_PREPARED_STATEMENTS:-true}"
