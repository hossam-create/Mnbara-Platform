# =============================================================================
# Mnbara Platform - Production Replica Patch
# =============================================================================
# This patch file sets replica counts for the production environment
# Production has higher replica counts for high availability
# =============================================================================

# =============================================================================
# API Gateway
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mnbara-prod
spec:
  replicas: 3

---

# =============================================================================
# User Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: mnbara-prod
spec:
  replicas: 3

---

# =============================================================================
# Matching Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: mnbara-prod
spec:
  replicas: 3

---

# =============================================================================
# Order Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: mnbara-prod
spec:
  replicas: 3

---

# =============================================================================
# Trip Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: mnbara-prod
spec:
  replicas: 3
