# =============================================================================
# Mnbara Platform - Production Docker Compose Configuration
# =============================================================================
# This configuration is for production deployment with:
# - Resource limits and health checks
# - Production-ready service configurations
# - No exposed unnecessary ports
# =============================================================================

services:
  # -----------------------------------------------------------------------------
  # API Gateway Service (Production)
  # -----------------------------------------------------------------------------
  api-gateway:
    image: ${DOCKER_REGISTRY:-docker.io}/mnbara/api-gateway:${SERVICE_VERSION:-latest}
    container_name: mnbara-api-gateway-prod
    ports:
      - "${API_GATEWAY_PORT:-80}:8080"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=api-gateway
      - SERVICE_VERSION=${SERVICE_VERSION:-latest}
      # Database connections
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # External services
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:3000}
      - MATCHING_SERVICE_URL=${MATCHING_SERVICE_URL:-http://matching-service:3000}
      # Security
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-1h}
    deploy:
      resources:
        limits:
          cpus: '${API_GATEWAY_CPU:-1}'
          memory: ${API_GATEWAY_MEMORY:-512M}
        reservations:
          cpus: '${API_GATEWAY_CPU_MIN:-0.5}'
          memory: ${API_GATEWAY_MEMORY_MIN:-256M}
      replicas: ${API_GATEWAY_REPLICAS:-2}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - mnbara-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------------------------
  # User Service (Production)
  # -----------------------------------------------------------------------------
  user-service:
    image: ${DOCKER_REGISTRY:-docker.io}/mnbara/user-service:${SERVICE_VERSION:-latest}
    container_name: mnbara-user-service-prod
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=user-service
      - SERVICE_VERSION=${SERVICE_VERSION:-latest}
      - PORT=3000
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # Security
      - JWT_SECRET=${JWT_SECRET}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      # Rate limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    deploy:
      resources:
        limits:
          cpus: '${USER_SERVICE_CPU:-1}'
          memory: ${USER_SERVICE_MEMORY:-512M}
        reservations:
          cpus: '${USER_SERVICE_CPU_MIN:-0.5}'
          memory: ${USER_SERVICE_MEMORY_MIN:-256M}
      replicas: ${USER_SERVICE_REPLICAS:-2}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - mnbara-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------------------------
  # Matching Service (Production)
  # -----------------------------------------------------------------------------
  matching-service:
    image: ${DOCKER_REGISTRY:-docker.io}/mnbara/matching-service:${SERVICE_VERSION:-latest}
    container_name: mnbara-matching-service-prod
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=matching-service
      - SERVICE_VERSION=${SERVICE_VERSION:-latest}
      - PORT=3000
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # Elasticsearch
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      # Matching configuration
      - MATCHING_ALGORITHM=${MATCHING_ALGORITHM:-hybrid}
      - MAX_MATCHING_RESULTS=${MAX_MATCHING_RESULTS:-50}
      - MATCHING_TIMEOUT_MS=${MATCHING_TIMEOUT_MS:-5000}
    deploy:
      resources:
        limits:
          cpus: '${MATCHING_SERVICE_CPU:-1}'
          memory: ${MATCHING_SERVICE_MEMORY:-1024M}
        reservations:
          cpus: '${MATCHING_SERVICE_CPU_MIN:-0.5}'
          memory: ${MATCHING_SERVICE_MEMORY_MIN:-512M}
      replicas: ${MATCHING_SERVICE_REPLICAS:-2}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - mnbara-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------------------------
  # Trip Service (Production)
  # -----------------------------------------------------------------------------
  trip-service:
    image: ${DOCKER_REGISTRY:-docker.io}/mnbara/trip-service:${SERVICE_VERSION:-latest}
    container_name: mnbara-trip-service-prod
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=trip-service
      - SERVICE_VERSION=${SERVICE_VERSION:-latest}
      - PORT=3000
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # Geolocation
      - GEOCODING_API_KEY=${GEOCODING_API_KEY}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
    deploy:
      resources:
        limits:
          cpus: '${TRIP_SERVICE_CPU:-1}'
          memory: ${TRIP_SERVICE_MEMORY:-512M}
        reservations:
          cpus: '${TRIP_SERVICE_CPU_MIN:-0.5}'
          memory: ${TRIP_SERVICE_MEMORY_MIN:-256M}
      replicas: ${TRIP_SERVICE_REPLICAS:-2}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - mnbara-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------------------------
  # Order Service (Production)
  # -----------------------------------------------------------------------------
  order-service:
    image: ${DOCKER_REGISTRY:-docker.io}/mnbara/order-service:${SERVICE_VERSION:-latest}
    container_name: mnbara-order-service-prod
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=order-service
      - SERVICE_VERSION=${SERVICE_VERSION:-latest}
      - PORT=3000
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # Payment gateway
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '${ORDER_SERVICE_CPU:-1}'
          memory: ${ORDER_SERVICE_MEMORY:-512M}
        reservations:
          cpus: '${ORDER_SERVICE_CPU_MIN:-0.5}'
          memory: ${ORDER_SERVICE_MEMORY_MIN:-256M}
      replicas: ${ORDER_SERVICE_REPLICAS:-2}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - mnbara-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------------------------
  # Redis Cluster (Production)
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mnbara-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-prod-data:/data
    networks:
      - mnbara-prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Networks (Overlay for Swarm mode)
# =============================================================================
networks:
  mnbara-prod:
    driver: overlay
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-prod-data:
    driver: local

# =============================================================================
# Secrets (for Swarm mode)
# =============================================================================
secrets:
  database_url:
    file: ./secrets/database_url.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
