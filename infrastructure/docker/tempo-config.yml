server:
  http_listen_port: 3200
  grpc_listen_port: 9095

# OTLP Receivers
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"
    jaeger:
      protocols:
        thrift_http:
          endpoint: "0.0.0.0:14268"
        grpc:
          endpoint: "0.0.0.0:14250"
        thrift_compact:
          endpoint: "0.0.0.0:6831"
        thrift_binary:
          endpoint: "0.0.0.0:6832"
    zipkin:
      endpoint: "0.0.0.0:9411"

# Ingestion limits
overrides:
  defaults:
    ingestion:
      max_traces_per_user: 100000
      max_bytes_per_trace: 5000000
      max_bytes_per_tag_values: 10000000

# Compactor configuration
compactor:
  compaction:
    block_retention: 168h  # 7 days retention

# Storage configuration
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    pool:
      max_workers: 100
      queue_depth: 1000
    wal:
      path: /var/tempo/wal

# Query frontend
query_frontend:
  max_outstanding_per_tenant: 100

# Querier
querier:
  search:
    query_timeout: 30s
    prefer_self: 10

# Generator (for metrics from traces)
generator:
  ring:
    kvstore:
      store: in-memory
  processor:
    service_graphs:
      max_items: 10000
    span_metrics:
      max_items: 10000
  storage:
    path: /var/tempo/generator
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# Search configuration
search:
  max_result_limit: 1000
  max_duration: 168h  # 7 days

# Metrics
metrics_generator_enabled: true
