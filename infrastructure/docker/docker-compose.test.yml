# =============================================================================
# Mnbara Platform - Testing Docker Compose Configuration
# =============================================================================
# This configuration is for running tests (unit, integration, e2e)
# Uses isolated test databases and minimal resource allocation
# =============================================================================

services:
  # -----------------------------------------------------------------------------
  # Test Database (PostgreSQL)
  # -----------------------------------------------------------------------------
  postgres-test:
    image: postgres:15-alpine
    container_name: mnbara-postgres-test
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mnbara_test}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mnbara_test}
      - POSTGRES_DB=${POSTGRES_DB:-mnbara_test}
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    networks:
      - mnbara-test
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnbara_test}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------------
  # Test Redis
  # -----------------------------------------------------------------------------
  redis-test:
    image: redis:7-alpine
    container_name: mnbara-redis-test
    ports:
      - "${REDIS_TEST_PORT:-6380}:6379"
    volumes:
      - redis-test-data:/data
    networks:
      - mnbara-test
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------------
  # Elasticsearch Test
  # -----------------------------------------------------------------------------
  elasticsearch-test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: mnbara-elasticsearch-test
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - elasticsearch-test-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_TEST_PORT:-9201}:9200"
    networks:
      - mnbara-test
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # -----------------------------------------------------------------------------
  # API Gateway Tests
  # -----------------------------------------------------------------------------
  api-gateway-test:
    build:
      context: ../../backend/services/api-gateway
      dockerfile: Dockerfile.test
    container_name: mnbara-api-gateway-test
    environment:
      - NODE_ENV=test
      - PORT=3000
      - SERVICE_NAME=api-gateway-test
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mnbara_test}:${POSTGRES_PASSWORD:-mnbara_test}@postgres-test:5432/${POSTGRES_DB:-mnbara_test}?schema=public
      - REDIS_URL=redis://redis-test:6379
    volumes:
      - ../../backend/services/api-gateway:/app
      - api-gateway-test-coverage:/app/coverage
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - mnbara-test
    restart: "no"
    command: npm test
    profiles:
      - test

  # -----------------------------------------------------------------------------
  # User Service Tests
  # -----------------------------------------------------------------------------
  user-service-test:
    build:
      context: ../../backend/services/user-service
      dockerfile: Dockerfile.test
    container_name: mnbara-user-service-test
    environment:
      - NODE_ENV=test
      - PORT=3000
      - SERVICE_NAME=user-service-test
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mnbara_test}:${POSTGRES_PASSWORD:-mnbara_test}@postgres-test:5432/${POSTGRES_DB:-mnbara_test}?schema=public
      - REDIS_URL=redis://redis-test:6379
    volumes:
      - ../../backend/services/user-service:/app
      - user-service-test-coverage:/app/coverage
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - mnbara-test
    restart: "no"
    command: npm test
    profiles:
      - test

  # -----------------------------------------------------------------------------
  # Matching Service Tests
  # -----------------------------------------------------------------------------
  matching-service-test:
    build:
      context: ../../backend/services/matching-service
      dockerfile: Dockerfile.test
    container_name: mnbara-matching-service-test
    environment:
      - NODE_ENV=test
      - PORT=3000
      - SERVICE_NAME=matching-service-test
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mnbara_test}:${POSTGRES_PASSWORD:-mnbara_test}@postgres-test:5432/${POSTGRES_DB:-mnbara_test}?schema=public
      - REDIS_URL=redis://redis-test:6379
      - ELASTICSEARCH_URL=http://elasticsearch-test:9200
    volumes:
      - ../../backend/services/matching-service:/app
      - matching-service-test-coverage:/app/coverage
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      elasticsearch-test:
        condition: service_healthy
    networks:
      - mnbara-test
    restart: "no"
    command: npm test
    profiles:
      - test

# =============================================================================
# Networks
# =============================================================================
networks:
  mnbara-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-test-data:
  redis-test-data:
  elasticsearch-test-data:
  api-gateway-test-coverage:
  user-service-test-coverage:
  matching-service-test-coverage:
