# =============================================================================
# Mnbara Platform - Prometheus Configuration
# =============================================================================
# Prometheus server configuration for monitoring
# =============================================================================

# =============================================================================
# Global Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: ${ENVIRONMENT:-development}
    project: mnbara-platform

# =============================================================================
# Alertmanager Configuration
# =============================================================================

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s
      api_version: v2

# =============================================================================
# Rule Files
# =============================================================================

rule_files:
  - "/etc/prometheus/rules/*.yml"

# =============================================================================
# Scrape Configurations
# =============================================================================

scrape_configs:
  # --------------------------------------------------------------------------
  # Prometheus Self-Monitoring
  # --------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    metrics_path: /metrics

  # --------------------------------------------------------------------------
  # API Gateway Metrics
  # --------------------------------------------------------------------------
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\\d+'
        replacement: '${1}'

  # --------------------------------------------------------------------------
  # User Service Metrics
  # --------------------------------------------------------------------------
  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - user-service:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\\d+'
        replacement: '${1}'

  # --------------------------------------------------------------------------
  # Matching Service Metrics
  # --------------------------------------------------------------------------
  - job_name: matching-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - matching-service:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\\d+'
        replacement: '${1}'

  # --------------------------------------------------------------------------
  # Order Service Metrics
  # --------------------------------------------------------------------------
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - order-service:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\\d+'
        replacement: '${1}'

  # --------------------------------------------------------------------------
  # Trip Service Metrics
  # --------------------------------------------------------------------------
  - job_name: trip-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - trip-service:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\\d+'
        replacement: '${1}'

  # --------------------------------------------------------------------------
  # Redis Metrics
  # --------------------------------------------------------------------------
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  # --------------------------------------------------------------------------
  # PostgreSQL Metrics
  # --------------------------------------------------------------------------
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  # --------------------------------------------------------------------------
  # Elasticsearch Metrics
  # --------------------------------------------------------------------------
  - job_name: elasticsearch
    metrics_path: /_cluster/health
    static_configs:
      - targets:
          - elasticsearch:9200

  # --------------------------------------------------------------------------
  # Node Exporter (Infrastructure)
  # --------------------------------------------------------------------------
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  # --------------------------------------------------------------------------
  # Kubernetes Metrics (if running on K8s)
  # --------------------------------------------------------------------------
  # - job_name: kubernetes-nodes
  #   scheme: https
  #   tls_config:
  #     ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  #   bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  #   kubernetes_sd_configs:
