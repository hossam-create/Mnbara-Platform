# =============================================================================
# Mnbara Platform - Grafana Configuration
# =============================================================================
# Grafana server configuration
# =============================================================================

[paths]
# Path to where grafana can store temp files, sessions, and sqlite3 db
data = /var/lib/grafana

# Path to where grafana can store logs
logs = /var/log/grafana

# Path to where grafana will automatically scan and look for plugins
plugins = /var/lib/grafana/plugins

# Provisioning configuration
provisioning = /etc/grafana/provisioning

[server]
# Protocol (http, https, h2, socket)
protocol = http

# The ip address to bind to, empty will bind to all interfaces
http_addr = 0.0.0.0

# The http port to use
http_port = 3000

# The public facing domain name used to access grafana from a browser
domain = ${GRAFANA_DOMAIN:-localhost}

# Redirect to correct domain if host header doesn't match domain
enforce_domain = false

# The full public facing url you use in browser, used for redirects and emails
root_url = %(protocol)s://%(domain)s:%(http_port)s/

# Serve Grafana from subpath specified in `root_url` option
serve_from_sub_path = false

# OS hard encoding
charset = UTF-8

[security]
# Default admin user, created on first start of grafana
admin_user = ${GRAFANA_ADMIN_USER:-admin}

# Default admin password, can be changed before first start of grafana
admin_password = ${GRAFANA_ADMIN_PASSWORD:-admin}

# Secret key used for signing some data source settings
secret_key = ${GRAFANA_SECRET_KEY:-your-secret-key}

# Disable user signup / registration
allow_sign_up = false

# Allow anonymous dashboard viewing
allow_embedding = true

# Check for grafana updates
check_for_updates = true

[users]
# Default role new users get
default_role = viewer

# Auto-assign new users as viewer or admin
auto_assign_role = viewer

# Prevent login for users
login_hint = email or username
password_hint = password

# UI theme
default_theme = dark

[auth]
# Login cookie name
login_cookie_name = grafana_session

# The lifetime (duration) before a login expires and is asked to log in again
login_maximum_inactive_lifetime = 7d

# The lifetime (duration) before a login expires
login_maximum_lifetime = 30d

# How often to clean up expired OAuth tokens
token_rotation_interval_minutes = 10

# Disable login form
disable_login_form = false

# Disable sign up
disable_sign_out_menu = false

# Show hidden org switcher in top nav
org_name_header = false

[dataproxy]
# How long the data proxy waits to read the headers of the response before timing out
dial_timeout = 30s

# How long the data proxy waits for the first response
timeout = 30s

# How many seconds the data proxy will wait for a successful TCP/TLS handshake
tls_handshake_timeout = 10s

# How long to wait before timing out when reading the response of the data proxy
expect_continue_timeout = 1s

# How long to wait for the data proxy to send the request headers to the upstream server
send_timeout = 30s

# How long to wait for the data proxy to receive a response from the upstream server
read_timeout = 30s

[dashboards]
# Number of dashboards home screen will show
home_dashboard_path = /etc/grafana/provisioning/dashboards/app-dashboard.json
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/app-dashboard.json

[metrics]
# Enable / Disable metrics reporting to graphite
enabled = true

# Graphite output
[metrics.graphite]
# Enable by setting the address (e.g. localhost:2003)
address =
prefix = prod.grafana.%(instance_name)s

[smtp]
# Enable SMTP
enabled = false

[notifications]
# Enables email notifications
enabled = false

[log]
# Either "console", "file", "syslog". Default is console and file
mode = console file

# Buffer log lines
buffer_len = 1000

# Syslog network type and address
syslog_network = tcp
syslog_address = localhost:514

[log.console]
level = info

[log.file]
level = info
log_rotate = true
max_days = 7
max_lines = 1000000
format = text

[quota]
# Enable quota
enabled = false

[analytics]
# Google Analytics universal tracking ID
# tracking_id =
# Report server errors
reporting_enabled = true

# Set to false to disable all checks to https://grafana.net for new versions
check_for_updates = true

[alerting]
# Makes it possible to turn off alert execution and alerting notifications
enabled = true

# Default setting for new alert rules. Defaults to categorize error and timeout as alerting
execute_alerts = true

# Default setting for new dashboards - records pause mode of alert
evaluation_timeout_seconds = 30

[unified_alerting]
# Enable the Unified Alerting feature
enabled = true

# Comma-separated list of organization IDs that should be authorized to provision unified alerting resources
authorization_org_id = 1

# Default setting for new alert rules. Defaults to categorize error and timeout as alerting
evaluation_timeout_seconds = 30

# Default setting for new alert rules. Defaults to categorize error and timeout as alerting
notification_timeout_seconds = 30

