# Archived Services Phase 3: Low Priority Services (24 services)

version: '3.8'

services:
  # ========================================
  # PHASE 3: LOW PRIORITY SERVICES (24 services)
  # ========================================

  # 42. preference-service
  preference-service:
    build: ./backend/services/archived/preference-service
    container_name: mnbarh-preference-service
    ports:
      - "3019:3019"
    environment:
      - DATABASE_URL=postgresql://mnbarh:mnbarh_dev_password@postgres:5432/mnbarh
      - REDIS_URL=redis:6379
      - PORT=3019
    networks:
      - mnbarh-network
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3019/health"]
      interval: 30s
      timeout: 10s
      retries: 3

