  # ===================
  # MONITORING
  # ===================

  prometheus:
    image: prom/prometheus:latest
    container_name: mnbarh-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - mnbarh-network

  grafana:
    image: grafana/grafana:latest
    container_name: mnbarh-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mnbarh-network

networks:
  mnbarh-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  listing_uploads:
  p2p_uploads:
