# Archived Services Phase 2: Medium Priority Services (20 services)

version: '3.8'

services:
  # ========================================
  # PHASE 2: MEDIUM PRIORITY SERVICES (20 services)
  # ========================================

  # 22. profile-service
  profile-service:
    build: ./backend/services/archived/profile-service
    container_name: mnbarh-profile-service
    ports:
      - "3018:3018"
    environment:
      - DATABASE_URL=postgresql://mnbarh:mnbarh_dev_password@postgres:5432/mnbarh
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PORT=3018
    networks:
      - mnbarh-network
    depends_on:
      - postgres
      - elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3018/health"]
      interval: 30s
      timeout: 10s
      retries: 3

